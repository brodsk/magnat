 const desiredHookY=activeMould.group.position.y+1.35;

  item.group.position.y+=(item.target.y-item.group.position.y)*speed;

 }

function canOccupy(x,z){
  if(x < -15.25+PLAYER_RADIUS || x > 15.25-PLAYER_RADIUS || z < -15.25+PLAYER_RADIUS || z > 15.25-PLAYER_RADIUS)return false;
  for(const o of obstacles){
    const nx=clamp(x,o.minX,o.maxX),nz=clamp(z,o.minZ,o.maxZ);
    const dx=x-nx,dz=z-nz;
    if(dx*dx+dz*dz<PLAYER_RADIUS*PLAYER_RADIUS)return false;
  }
  return true;
}
function move(dt){
  let forward=player.moveY+(keys.KeyW||keys.ArrowUp?-1:0)+(keys.KeyS||keys.ArrowDown?1:0);
  let strafe=player.moveX+(keys.KeyD||keys.ArrowRight?1:0)+(keys.KeyA||keys.ArrowLeft?-1:0);
  const len=Math.hypot(forward,strafe);
  if(len>1){forward/=len;strafe/=len}
  const speed=3.5*dt;
  const dx=(-Math.sin(player.yaw)*(-forward)+Math.cos(player.yaw)*strafe)*speed;
  const dz=(-Math.cos(player.yaw)*(-forward)-Math.sin(player.yaw)*strafe)*speed;
  // Resolve axes separately so the player can slide along machine guards and walls.
  const nextX=clamp(player.x+dx,-15.25+PLAYER_RADIUS,15.25-PLAYER_RADIUS);
  if(canOccupy(nextX,player.z))player.x=nextX;
  const nextZ=clamp(player.z+dz,-15.25+PLAYER_RADIUS,15.25-PLAYER_RADIUS);
  if(canOccupy(player.x,nextZ))player.z=nextZ;
  updateCamera();
}

 else if(n==='conveyor'){showPanel('Конвейер и перемещение деталей',`<p>Оборудование для дальнейшего перемещения отлитых деталей.</p><div class="field"><label>Состояние учебного конвейера</label><strong id="convState" style="color:var(--accent)">${conveyorRunning?'RUNNING':'STOPPED'}</strong></div><button class="action" id="conv">${conveyorRunning?'ОСТАНОВИТЬ КОНВЕЙЕР':'ЗАПУСТИТЬ КОНВЕЙЕР'}</button><p id="convResult">Virtual parts produced: ${partCount}.</p>`);content.querySelector('#conv').onclick=()=>{conveyorRunning=!conveyorRunning;content.querySelector('#convState').textContent=conveyorRunning?'RUNNING':'STOPPED';content.querySelector('#conv').textContent=conveyorRunning?'ОСТАНОВИТЬ КОНВЕЙЕР':'ЗАПУСТИТЬ КОНВЕЙЕР';content.querySelector('#convResult').textContent=conveyorRunning?'Ролики конвейера движутся в учебной модели.':'Конвейер остановлен.';toast(conveyorRunning?'Конвейер запущен':'Конвейер остановлен')}}
else{showPanel('Оборудование',`<p>${n} · This equipment will receive a dedicated training module in a later build.</p>`)}}
document.querySelector('#interact').addEventListener('click',interact);addEventListener('keydown',e=>{if(e.code==='KeyE'&&!activePanel)interact();if(e.code==='Escape')closePanel()});

 tube(scene,'machine overhead power conduit',[[-7.8,4.92,-2.5],[-7.0,4.65,-2.5],[-5.8,4.55,-2.5],[-5.2,4.1,-2.5],[-5.1,3.2,-2.5]],.055,conduitMat);
 for(const z of [-7,-3,1,5,9]){

function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!activePanel)move(dt);updateMachineMotion(dt);updateMouldMotion(dt);updateRobotTransfer(dt);currentTarget=nearestTarget();const hint=document.querySelector('#hint');const targetNames={'control console':'пульт управления ENGEL','ENGEL base':'основание термопластавтомата','clamping unit':'узел смыкания','mold':'пресс-форма','injection unit':'узел впрыска','robot pedestal':'основание робота ABB','material dryer':'сушилка гранулята','dryer hopper':'бункер сушилки','temperature controller':'термостат пресс-формы','safety gate':'защитная дверь','crane pendant':'пульт мостового крана','conveyor':'конвейер','replacement mould':'сменная пресс-форма'};hint.innerHTML=currentTarget?'Рядом: <strong>'+(targetNames[currentTarget.name]||currentTarget.name)+'</strong> · нажмите «ДЕЙСТВИЕ»':'Осматривайте ячейку. Подойдите к оборудованию и наведитесь на него.';renderer.render(scene,camera)}
const clock=new THREE.Clock();updateCamera();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)});
