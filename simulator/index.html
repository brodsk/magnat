<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}

#stick{position:absolute;width:48px;height:48px;border-radius:50%;left:33px;top:33px;background:#b8ef6970;border:1px solid #d9ff9e;box-shadow:0 3px 12px #0008}
#looktip{position:fixed;right:16px;bottom:calc(26px + env(safe-area-inset-bottom));color:#d9e4e9a8;font-size:10px;pointer-events:none;text-align:right}
#interact{position:fixed;right:20px;bottom:calc(70px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;border:2px solid #d9ff9e;background:#b8ef69e8;color:#14200e;font-weight:800;font-size:12px;box-shadow:0 5px 18px #0008;touch-action:manipulation}
#panel{position:fixed;inset:auto 0 0 0;max-height:82dvh;background:#101a22f5;border:1px solid #536773;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .22s ease;overflow:auto;touch-action:pan-y;z-index:5}
#panel.open{transform:translateY(0)}#panel h2{margin:0 36px 8px 0;font-size:18px}#panel p{color:var(--muted);line-height:1.5;font-size:13px}#close{position:absolute;right:14px;top:12px;border:1px solid var(--line);background:#263843;color:white;border-radius:8px;padding:8px 11px}

-note{border-left:3px solid var(--warn);padding:8px 10px;background:#342d20;color:#e9d6ae;border-radius:4px;font-size:11px;line-height:1.45}
.action{background:#b8ef69;color:#15200e;border:0;border-radius:9px;padding:12px 15px;font-weight:800;width:100%;margin-top:8px}.secondary{background:#263843;color:var(--text);border:1px solid var(--line)}

window.addEventListener('error',e=>{const p=document.getElementById('fatal-error');if(p){p.hidden=false;p.textContent='SIMULATOR ERROR: '+(e.message||'JavaScript failed to load')+' · '+(e.filename||'')+':'+(e.lineno||'')}});

<script type="module">

}renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;mount.appendChild(renderer.domElement);

const floorCanvas=document.createElement('canvas');floorCanvas.width=floorCanvas.height=256;const floorCtx=floorCanvas.getContext('2d');floorCtx.fillStyle='#68777c';floorCtx.fillRect(0,0,256,256);let floorSeed=417;for(let i=0;i<5200;i++){floorSeed=(floorSeed*1664525+1013904223)>>>0;const x=floorSeed&255;floorSeed=(floorSeed*1664525+1013904223)>>>0;const y=floorSeed&255;const shade=90+(floorSeed%45);floorCtx.fillStyle='rgba('+shade+','+(shade+7)+','+(shade+10)+','+(0.08+(floorSeed%18)/100)+')';floorCtx.fillRect(x,y,1+(floorSeed%3),1+(floorSeed%2))}const floorTexture=new THREE.CanvasTexture(floorCanvas);floorTexture.wrapS=floorTexture.wrapT=THREE.RepeatWrapping;floorTexture.repeat.set(6,6);floorTexture.colorSpace=THREE.SRGBColorSpace;
const mats={floor:new THREE.MeshStandardMaterial({color:0xffffff,map:floorTexture,roughness:.96}),wall:new THREE.MeshStandardMaterial({color:0xd4dadd,roughness:.85}),steel:new THREE.MeshStandardMaterial({color:0x53636a,metalness:.55,roughness:.4}),dark:new THREE.MeshStandardMaterial({color:0x202a30,metalness:.25,roughness:.65}),white:new THREE.MeshStandardMaterial({color:0xdce3e5,metalness:.2,roughness:.45}),orange:new THREE.MeshStandardMaterial({color:0xf28c28,metalness:.15,roughness:.5}),glass:new THREE.MeshStandardMaterial({color:0x6d9ba7,transparent:true,opacity:.42,metalness:.2,roughness:.15}),green:new THREE.MeshStandardMaterial({color:0x8be05a,emissive:0x234a0d}),yellow:new THREE.MeshStandardMaterial({color:0xffc94f}),red:new THREE.MeshStandardMaterial({color:0xf05c54})};
function box(parent,name,pos,size,mat,interactive=false){const m=new THREE.Mesh(new THREE.BoxGeometry(...size),mat);m.name=name;m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);if(interactive)targets.push(m);return m}
function cyl(parent,name,pos,r1,r2,len,mat,axis='y',segments=16){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,segments),mat);m.name=name;m.position.set(...pos);if(axis==='x')m.rotation.z=Math.PI/2;else if(axis==='z')m.rotation.x=Math.PI/2;m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}

const targets=[];

box(scene,'factory floor',[0,-.12,0],[32,.2,32],mats.floor);
for(let x=-15;x<=15;x+=3)box(scene,'floor marking',[x,-.012,0],[.018,.008,31],new THREE.MeshStandardMaterial({color:0x9aa6a8,roughness:1}));
// Painted traffic lanes, work zones and floor expansion joints.
const floorYellow=new THREE.MeshStandardMaterial({color:0xf0bd37,roughness:.82});const floorWhite=new THREE.MeshStandardMaterial({color:0xc8d0d0,roughness:.9});
for(const z of [-8.2,1.8,7.4])box(scene,'yellow floor boundary',[0,-.006,z],[24,.012,.075],floorYellow);
for(const x of [-10.5,8.8])box(scene,'yellow floor boundary',[x,-.006,-3],[.075,.012,18],floorYellow);
for(let z=-13;z<14;z+=2)box(scene,'floor joint',[-0,-.009,z],[30,.006,.012],floorWhite);

for(let i=0;i<12;i++){const stripe=box(scene,'hazard floor stripe',[-8.1+i*.28,-.002,2.7],[.13,.012,1.0],floorYellow);stripe.rotation.y=.45;}
box(scene,'back wall',[0,3,-15.8],[32,6,.3],mats.wall);box(scene,'left wall',[-16,3,0],[.3,6,32],mats.wall);box(scene,'right wall',[16,3,0],[.3,6,32],mats.wall);
for(let x=-12;x<=12;x+=4){box(scene,'roof beam',[x,5.8,0],[.18,.18,30],mats.steel);const light=new THREE.PointLight(0xfff4d9,28,12);light.position.set(x,5.2,0);scene.add(light);box(scene,'LED fixture',[x,5.3,0],[1.3,.08,.3],mats.white);box(scene,'LED diffuser',[x,5.245,0],[1.18,.025,.24],new THREE.MeshStandardMaterial({color:0xfff5d9,emissive:0xffe7b2,emissiveIntensity:.45}))}
// Roof purlins and utility cable trays.
for(let z=-12;z<=12;z+=4){box(scene,'roof purlin',[0,5.62,z],[30,.12,.12],mats.steel)}
box(scene,'overhead cable tray',[-11,4.9,-1],[.35,.12,27],mats.dark);box(scene,'overhead pipe rack',[11,4.75,-1],[.28,.18,27],mats.steel);for(const z of [-12,-6,0,6,12]){box(scene,'cable tray hanger',[-11,5.28,z],[.08,.62,.08],mats.steel);box(scene,'pipe rack hanger',[11,5.18,z],[.08,.86,.08],mats.steel)}

const meshMat=new THREE.MeshStandardMaterial({color:0x71848a,metalness:.35,roughness:.6});for(let x=-8.1;x<=8.1;x+=.18)box(scene,'fence mesh vertical',[x,1.25,-5],[.012,2.12,.018],meshMat);for(let y=.25;y<=2.25;y+=.18)box(scene,'fence mesh horizontal',[0,y,-5],[16.2,.012,.018],meshMat);
// ENGEL injection molding machine: simplified but recognisable machine architecture.
const engel=new THREE.Group();engel.position.set(-3,0,-3);scene.add(engel);

for(let z=-4.1;z<=-1.9;z+=.42){box(scene,'ENGEL floor hazard stripe',[-5.88,.012,z],[.075,.018,.24],mats.yellow);box(scene,'ENGEL floor hazard stripe',[-.12,.012,z],[.075,.018,.24],mats.yellow)}
for(const z of [-.82,.82])for(const y of [.95,2.75]){const tie= new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,2.1,12),mats.yellow);tie.rotation.z=Math.PI/2;tie.position.set(-.45,y,z);engel.add(tie)}

function makeMould(name,position,bodyColor){
 const g=new THREE.Group();g.name=name;g.position.set(position[0],position[1],position[2]);scene.add(g);
 const bodyMat=new THREE.MeshStandardMaterial({color:bodyColor,metalness:.72,roughness:.3});
 const plateMat=new THREE.MeshStandardMaterial({color:0x87969b,metalness:.82,roughness:.24});

 const body=box(g,'mould body',[0,0,0],[.86,1.48,1.38],bodyMat);body.name=name==='OLD MOULD'?'mold':'replacement mould';
 box(g,'fixed mould plate',[-.48,0,0],[.12,1.62,1.52],plateMat);
 box(g,'moving mould plate',[.48,0,0],[.12,1.62,1.52],plateMat);
 box(g,'parting line',[0,0,0],[.018,1.5,1.4],mats.yellow);
 for(const x of [-.48,.48])for(const z of [-.55,.55])for(const y of [-.58,.58]){
  cyl(g,'mould clamp bolt',[x,y,z],.065,.065,.06,darkMat,'x',12);
  cyl(g,'mould bolt head',[x+(x<0?-.07:.07),y,z],.085,.085,.035,plateMat,'x',6);
 }
 for(const z of [-.45,.45]){cyl(g,'leader pin',[0,.55,z],.055,.055,.32,mats.yellow,'x',12);cyl(g,'leader bush',[0,-.55,z],.09,.09,.16,darkMat,'x',16)}
 const slingMat=new THREE.MeshStandardMaterial({color:0xffb52e,metalness:.25,roughness:.55});
 const slings=new THREE.Group();slings.visible=false;g.add(slings);
 tube(slings,'lifting sling left',[[-.36,.82,-.48],[-.18,1.12,-.25],[0,1.35,0]],.035,slingMat);
 tube(slings,'lifting sling right',[[.36,.82,.48],[.18,1.12,.25],[0,1.35,0]],.035,slingMat);
 return {group:g,body,slings,target:null};
}
const oldMould=makeMould('OLD MOULD',[-3.45,1.85,-3],0x34434a);

function setCraneForMould(m){craneTarget.x=m.group.position.x;craneTarget.z=m.group.position.z}
function setMouldTarget(item,x,y,z){item.target={x,y,z};craneTarget.x=x;craneTarget.z=z}
function updateMouldMotion(dt){
 const speed=Math.min(1,dt*1.7);
 craneTrolley.position.x+=(craneTarget.x-craneTrolley.position.x)*speed;
 craneBridge.position.z+=(craneTarget.z-craneBridge.position.z)*speed;
 const activeMould=mouldStep>=8?newMould:oldMould;
 const desiredHookY=activeMould.group.position.y+1.35;
 mouldHookY+=(desiredHookY-mouldHookY)*Math.min(1,dt*2.5);
 const cableLength=Math.max(.35,4.78-mouldHookY);
 hoistCable.scale.y=cableLength;hoistCable.position.y=-cableLength/2;
 craneHook.position.y=-cableLength-.12;
 for(const item of [oldMould,newMould])if(item.target){
  item.group.position.x+=(item.target.x-item.group.position.x)*speed;
  item.group.position.y+=(item.target.y-item.group.position.y)*speed;
  item.group.position.z+=(item.target.z-item.group.position.z)*speed;
 }
 const craneMoving=Math.abs(craneTrolley.position.x-craneTarget.x)>.01||Math.abs(craneBridge.position.z-craneTarget.z)>.01;
 const mouldMoving=[oldMould,newMould].some(item=>item.target&&Math.hypot(item.target.x-item.group.position.x,item.target.y-item.group.position.y,item.target.z-item.group.position.z)>.01);
 if(craneMoving||mouldMoving)renderer.shadowMap.needsUpdate=true;
}

function diagnoseProcess(v=readProcessSettings()){
 const faults=[];
 const avg=(v.s1+v.s2+v.s7+v.s8)/4;
 if(avg<205)faults.push(['недостаточная температура расплава','Риск затруднённого заполнения и холодных спаев.']);
 if(avg>255)faults.push(['чрезмерная температура расплава','Риск термической деградации и потемнения материала.']);
 if(v.s3<20)faults.push(['низкая скорость впрыска','Возможен недолив или заметные линии спая.']);
 if(v.s3>105)faults.push(['чрезмерная скорость впрыска','Возможны следы потока, перегрев от сдвига и облой при недостаточном смыкании.']);
 if(v.s4<30)faults.push(['низкое давление выдержки','Вероятны усадочные раковины и недостаточная компенсация усадки.']);
 if(v.s4>88)faults.push(['чрезмерное давление выдержки','Риск переуплотнения, остаточных напряжений и облоя.']);
 if(v.s5<12)faults.push(['недостаточное время охлаждения','Деталь может деформироваться при извлечении.']);
 if(v.s5>42)faults.push(['чрезмерное время охлаждения','Цикл становится неоправданно длинным.']);
 if(v.s6<42)faults.push(['низкое усилие смыкания','При высоком давлении возможен облой по разъёму формы.']);
 if(v.s6>94)faults.push(['чрезмерное усилие смыкания','Повышенная нагрузка на форму и узел смыкания.']);
 if(v.s11<4||v.s11>30)faults.push(['сомнительное положение переключения V/P','Возможны недоуплотнение или избыточное давление в конце заполнения.']);
 if(v.s12<2)faults.push(['короткая выдержка','Усадка может не компенсироваться до замерзания литника.']);
 if(v.s9>190)faults.push(['высокая скорость вращения шнека','Возможен избыточный нагрев материала и нестабильная пластикация.']);
 if(v.s10>45)faults.push(['высокое противодавление','Возможен дополнительный нагрев и увеличение времени пластикации.']);
 if(v.s13<18)faults.push(['малый ход дозирования','Возможна недостаточная масса впрыска и нестабильная подушка шнека.']);
 if(v.s13>82)faults.push(['чрезмерный ход дозирования','Увеличивается время пластикации; требуется проверка соответствия дозы объёму детали.']);
 if(v.s14>10)faults.push(['чрезмерная декомпрессия','Возможны подсос воздуха, нестабильная масса дозы и вытекание материала из сопла при неверной настройке.']);
 if(v.s15<15||v.s15>110)faults.push(['неподходящая скорость второй ступени впрыска','Переход между ступенями может вызвать линии потока, недолив или скачок давления.']);
 if(Math.abs(v.s16-v.s4)>38)faults.push(['резкий переход давления выдержки','Ступени выдержки заметно различаются; возможна неравномерная компенсация усадки.']);
 if(Math.abs(v.s17-v.s11)>24)faults.push(['несогласованные точки V/P','Основная и дополнительная точки переключения расходятся; проверьте профиль впрыска.']);
 if(selectedPartType==='indicator'&&avg>245)faults.push(['риск оптических дефектов линзы','Для прозрачной детали особенно заметны потемнение, полосы и неоднородность поверхности.']);
 if(selectedPartType==='carrier'&&v.s5<16)faults.push(['риск деформации несущей детали','Для детали с рёбрами и бобышками геометрическая стабильность зависит от охлаждения и конструкции формы.']);
 return {faults,quality:faults.length===0?'OK':faults.length<=2?'WARNING':'REJECT',avg};
}

function canOccupy(x,z){
  if(x < -15.25+PLAYER_RADIUS || x > 15.25-PLAYER_RADIUS || z < -15.25+PLAYER_RADIUS || z > 15.25-PLAYER_RADIUS)return false;
  for(const o of obstacles){
    const nx=clamp(x,o.minX,o.maxX),nz=clamp(z,o.minZ,o.maxZ);
    const dx=x-nx,dz=z-nz;
    if(dx*dx+dz*dz<PLAYER_RADIUS*PLAYER_RADIUS)return false;
  }
  return true;
}
function move(dt){
  let forward=player.moveY+(keys.KeyW||keys.ArrowUp?-1:0)+(keys.KeyS||keys.ArrowDown?1:0);
  let strafe=player.moveX+(keys.KeyD||keys.ArrowRight?1:0)+(keys.KeyA||keys.ArrowLeft?-1:0);
  const len=Math.hypot(forward,strafe);
  if(len>1){forward/=len;strafe/=len}
  const speed=3.5*dt;
  const dx=(-Math.sin(player.yaw)*(-forward)+Math.cos(player.yaw)*strafe)*speed;
  const dz=(-Math.cos(player.yaw)*(-forward)-Math.sin(player.yaw)*strafe)*speed;
  // Resolve axes separately so the player can slide along machine guards and walls.
  const nextX=clamp(player.x+dx,-15.25+PLAYER_RADIUS,15.25-PLAYER_RADIUS);
  if(canOccupy(nextX,player.z))player.x=nextX;
  const nextZ=clamp(player.z+dz,-15.25+PLAYER_RADIUS,15.25-PLAYER_RADIUS);
  if(canOccupy(player.x,nextZ))player.z=nextZ;
  updateCamera();
}

 const applyRobotAxes=()=>{base.rotation.y=Number(content.querySelector('#r1').value)*Math.PI/180;shoulder.rotation.z=Number(content.querySelector('#r2').value)*Math.PI/180;elbow.rotation.z=Number(content.querySelector('#r3').value)*Math.PI/180;wrist.rotation.x=Number(content.querySelector('#r4').value)*Math.PI/180;wrist.rotation.y=Number(content.querySelector('#r5').value)*Math.PI/180;wrist.rotation.z=Number(content.querySelector('#r6').value)*Math.PI/180};
 content.querySelectorAll('input[type=range]').forEach(input=>input.addEventListener('input',()=>{content.querySelector('#a'+input.id.slice(1)).textContent=input.value+'°';applyRobotAxes()}));
 applyRobotAxes();
 content.querySelector('#robotResult').insertAdjacentHTML('beforebegin','<div class="field"><label for="robotToolSelect">Сменный захват / инструмент</label><select id="robotToolSelect" style="width:100%;padding:11px;background:#263843;color:white;border:1px solid #536773;border-radius:8px"><option value="suction4">Вакуумная плита · 4 присоски</option><option value="suction6">Вакуумная плита · 6 присосок</option><option value="parallel">Механический параллельный захват</option></select><p id="toolDescription">Четыре присоски для плоских и средних по размеру пластиковых деталей.</p></div><button class="action" id="pickPlace">ЗАПУСТИТЬ ДЕМОНСТРАЦИЮ ЗАБОРА И УКЛАДКИ</button><p class="hmi-note">Учебная демонстрация: робот забирает образец из открытой формы и переносит его на конвейер. Реальная программа робота не создаётся.</p>');
 content.querySelector('#robotToolSelect').value=robotToolType;
 content.querySelector('#robotToolSelect').onchange=e=>{if(robotTransfer.active){toast('Нельзя менять инструмент во время движения робота');e.target.value=robotToolType;return}setRobotTool(e.target.value);const d={suction4:'Четыре присоски для плоских и средних деталей.',suction6:'Шесть присосок для крупных деталей с несколькими точками захвата.',parallel:'Двухпальцевый механический захват для деталей с подходящими боковыми поверхностями.'};content.querySelector('#toolDescription').textContent=d[robotToolType];content.querySelector('#robotResult').textContent='Установлен инструмент: '+e.target.options[e.target.selectedIndex].text+'.';toast('Концевой инструмент заменён')};
 content.querySelector('#pickPlace').onclick=startRobotTransfer;
 content.querySelector('#home').onclick=()=>{const values=[0,-15,35,0,0,0];values.forEach((v,i)=>{content.querySelector('#r'+(i+1)).value=v;content.querySelector('#a'+(i+1)).textContent=v+'°'});applyRobotAxes();content.querySelector('#robotResult').textContent='Выбрана условная исходная поза. Реальные пределы робота, инструмент и зоны безопасности требуют отдельной проверки.';toast('Выбрана исходная поза ABB (имитация)')};
}else if(n==='material dryer'||n==='dryer hopper'||n==='temperature controller'){
 showPanel('Подача подготовленного материала',`<p>Подготовка и сушка гранулята относятся к обязанностям грануловщика. Наставовач не управляет сушилкой и не выполняет подготовку материала.</p><div class="hmi-note">Перед наладкой проверьте, что на машину подан материал, соответствующий производственному заказу, а грануловщик подтвердил его готовность.</div><div class="field"><label>Статус материала для учебного сценария</label><strong style="color:var(--accent)">ГОТОВ · ПОДАЧА ПОДТВЕРЖДЕНА</strong><p>Материал условно подготовлен ответственным сотрудником. Игрок продолжает наладку vstrekolisu.</p></div><p>В следующих версиях здесь появится только информационный статус материала и выбранной партии — без управления сушилкой со стороны игрока.</p>`);
}else if(n==='safety gate'){showPanel('Безопасность ячейки',`<p>Безопасность обязательна при настройке и автоматическом цикле. Это только учебная блокировка, а не сертифицированная цепь безопасности.</p><div class="field"><label>Состояние учебной блокировки</label><strong id="gateState" style="color:var(--warn)">${safetyGateClosed?'GATE CLOSED · INTERLOCK SATISFIED':'GATE OPEN · AUTOMATIC MODE INHIBITED'}</strong></div><button class="action" id="gateToggle">${safetyGateClosed?'OPEN SAFETY GATE (SIMULATED)':'CLOSE SAFETY GATE (SIMULATED)'}</button><p id="gateResult">${machineCycleActive?'Цикл выполняется. Открытие двери заблокировано.':'Состояние виртуальной двери определяет, разрешён ли запуск учебного цикла.'}</p>`);content.querySelector('#gateToggle').onclick=()=>{if(machineCycleActive){content.querySelector('#gateResult').textContent='Открытие заблокировано: учебный цикл выполняется.';toast('Safety interlock: cycle active');return}safetyGateClosed=!safetyGateClosed;content.querySelector('#gateState').textContent=safetyGateClosed?'GATE CLOSED · INTERLOCK SATISFIED':'GATE OPEN · AUTOMATIC MODE INHIBITED';content.querySelector('#gateState').style.color=safetyGateClosed?'var(--accent)':'var(--warn)';content.querySelector('#gateToggle').textContent=safetyGateClosed?'OPEN SAFETY GATE (SIMULATED)':'CLOSE SAFETY GATE (SIMULATED)';content.querySelector('#gateResult').textContent=safetyGateClosed?'В учебной модели дверь закрыта.':'Дверь открыта. Автоматический цикл заблокирован.';toast(safetyGateClosed?'Виртуальная дверь закрыта':'Виртуальная дверь открыта')}}
else if(n==='crane pendant'||n==='mold'||n==='replacement mould'){showMouldChangePanel()}
 else if(n==='conveyor'){showPanel('Конвейер и перемещение деталей',`<p>Оборудование для дальнейшего перемещения отлитых деталей.</p><div class="field"><label>Состояние учебного конвейера</label><strong id="convState" style="color:var(--accent)">${conveyorRunning?'RUNNING':'STOPPED'}</strong></div><button class="action" id="conv">${conveyorRunning?'ОСТАНОВИТЬ КОНВЕЙЕР':'ЗАПУСТИТЬ КОНВЕЙЕР'}</button><p id="convResult">Virtual parts produced: ${partCount}.</p>`);content.querySelector('#conv').onclick=()=>{conveyorRunning=!conveyorRunning;content.querySelector('#convState').textContent=conveyorRunning?'RUNNING':'STOPPED';content.querySelector('#conv').textContent=conveyorRunning?'ОСТАНОВИТЬ КОНВЕЙЕР':'ЗАПУСТИТЬ КОНВЕЙЕР';content.querySelector('#convResult').textContent=conveyorRunning?'Ролики конвейера движутся в учебной модели.':'Конвейер остановлен.';toast(conveyorRunning?'Конвейер запущен':'Конвейер остановлен')}}
else{showPanel('Оборудование',`<p>${n} · This equipment will receive a dedicated training module in a later build.</p>`)}}
document.querySelector('#interact').addEventListener('click',interact);addEventListener('keydown',e=>{if(e.code==='KeyE'&&!activePanel)interact();if(e.code==='Escape')closePanel()});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!activePanel)move(dt);updateMachineMotion(dt);updateMouldMotion(dt);updateRobotTransfer(dt);currentTarget=nearestTarget();const hint=document.querySelector('#hint');const targetNames={'control console':'пульт управления ENGEL','ENGEL base':'основание термопластавтомата','clamping unit':'узел смыкания','mold':'пресс-форма','injection unit':'узел впрыска','robot pedestal':'основание робота ABB','material dryer':'сушилка гранулята','dryer hopper':'бункер сушилки','temperature controller':'термостат пресс-формы','safety gate':'защитная дверь','crane pendant':'пульт мостового крана','conveyor':'конвейер','replacement mould':'сменная пресс-форма'};hint.innerHTML=currentTarget?'Рядом: <strong>'+(targetNames[currentTarget.name]||currentTarget.name)+'</strong> · нажмите «ДЕЙСТВИЕ»':'Осматривайте ячейку. Подойдите к оборудованию и наведитесь на него.';renderer.render(scene,camera)}
const clock=new THREE.Clock();updateCamera();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)});
</script>
