function updateCamera(){camera.position.set(player.x,1.68,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyId=null;
function joystickMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=37,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform='translate('+dx+'px,'+dy+'px)';player.moveX=dx/max;player.moveY=dy/max}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);joystickMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joystickMove(e)});function joyEnd(e){if(e.pointerId===joyId){joyId=null;player.moveX=0;player.moveY=0;stick.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
let lookId=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.42||activePanel)return;lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(lookId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;player.yaw-=dx*.004;player.pitch=clamp(player.pitch-dy*.003,-1.15,1.15)});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null});
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
// Collision volumes are conservative walk-space footprints, not machine geometry.
const PLAYER_RADIUS=.34;
const obstacles=[
  {minX:-5.95,maxX:-.05,minZ:-4.32,maxZ:-1.68,name:'ENGEL machine'},
  {minX:-8.72,maxX:-7.28,minZ:-4.72,maxZ:-3.28,name:'material dryer'},
  {minX:-8.72,maxX:-7.28,minZ:-2.25,maxZ:-1.35,name:'temperature controller'},
  {minX:3.15,maxX:7.05,minZ:-2.35,maxZ:-.65,name:'ABB robot cell'},
  {minX:-1.72,maxX:5.72,minZ:3.28,maxZ:4.72,name:'conveyor'},
  {minX:9.18,maxX:10.82,minZ:-7.52,maxZ:-6.48,name:'electrical cabinet'},
  {minX:7.18,maxX:8.82,minZ:-3.38,maxZ:-2.62,name:'cooling manifold'},
  {minX:11.58,maxX:12.02,minZ:-2.22,maxZ:-1.78,name:'compressed-air drop'},
  {minX:5.78,maxX:6.22,minZ:1.78,maxZ:2.22,name:'warning beacon'},
  {minX:-8.25,maxX:8.25,minZ:-5.16,maxZ:-4.84,name:'safety fence'}
];
function canOccupy(x,z){
  if(x < -15.25+PLAYER_RADIUS || x > 15.25-PLAYER_RADIUS || z < -15.25+PLAYER_RADIUS || z > 15.25-PLAYER_RADIUS)return false;
  for(const o of obstacles){
    const nx=clamp(x,o.minX,o.maxX),nz=clamp(z,o.minZ,o.maxZ);
    const dx=x-nx,dz=z-nz;
    if(dx*dx+dz*dz<PLAYER_RADIUS*PLAYER_RADIUS)return false;
  }
  return true;
}
function move(dt){
  let forward=player.moveY+(keys.KeyW||keys.ArrowUp?-1:0)+(keys.KeyS||keys.ArrowDown?1:0);
  let strafe=player.moveX+(keys.KeyD||keys.ArrowRight?1:0)+(keys.KeyA||keys.ArrowLeft?-1:0);
  const len=Math.hypot(forward,strafe);
  if(len>1){forward/=len;strafe/=len}
  const speed=3.5*dt;
  const dx=(-Math.sin(player.yaw)*(-forward)+Math.cos(player.yaw)*strafe)*speed;
  const dz=(-Math.cos(player.yaw)*(-forward)-Math.sin(player.yaw)*strafe)*speed;
  // Resolve axes separately so the player can slide along machine guards and walls.
  const nextX=clamp(player.x+dx,-15.25+PLAYER_RADIUS,15.25-PLAYER_RADIUS);
  if(canOccupy(nextX,player.z))player.x=nextX;
  const nextZ=clamp(player.z+dz,-15.25+PLAYER_RADIUS,15.25-PLAYER_RADIUS);
  if(canOccupy(player.x,nextZ))player.z=nextZ;
  updateCamera();
}
const raycaster=new THREE.Raycaster();let currentTarget=null;
function nearestTarget(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects(targets,false);if(!hits.length||hits[0].distance>3.4)return null;return hits[0].object}
const panel=document.querySelector('#panel'),content=document.querySelector('#panelContent');
function showPanel(title,body){activePanel=true;content.innerHTML='<h2>'+title+'</h2>'+body;panel.classList.add('open')}
function closePanel(){panel.classList.remove('open');activePanel=false}
document.querySelector('#close').onclick=closePanel;
function startTrainingCycle(){
 const result=document.querySelector('#cycleResult'),report=m=>{if(result)result.textContent=m};
 if(machineCycleActive){report('Cycle already running.');return}
 if(!trainingSettingsApplied){report('START BLOCKED · apply the training settings first.');toast('Interlock: settings not applied');return}
 if(!materialPrepared){report('START BLOCKED · complete material preparation first.');toast('Interlock: material not prepared');return}
 if(!safetyGateClosed){report('START BLOCKED · close the safety gate first.');toast('Interlock: safety gate open');return}
 machineCycleActive=true;
 const phases=[['CLAMPING','CLAMPING · simulated'],['INJECTION','INJECTION · simulated'],['HOLDING','HOLDING · simulated'],['COOLING','COOLING · simulated'],['EJECTION','MOULD OPEN / EJECTION · simulated']];
 let i=0;const advance=()=>{if(i<phases.length){cyclePhase=phases[i][0];document.querySelector('#cellStatus').textContent=cyclePhase;report('Cycle running: '+phases[i++][1]);cycleTimer=setTimeout(advance,1500)}else{machineCycleActive=false;cycleTimer=null;cyclePhase='IDLE';partCount++;movingPlaten.position.x=.55;screw.position.x=2.05;document.querySelector('#cellStatus').textContent='READY · '+partCount+' PART'+(partCount===1?'':'S');report('Cycle complete. Virtual part count: '+partCount+'. Inspect the process state before starting another training cycle.');toast('Training cycle complete · part '+partCount)}};
 advance();
}
function updateMachineMotion(dt){
 const closed=['CLAMPING','INJECTION','HOLDING','COOLING'].includes(cyclePhase),clampTarget=closed?.15:.55;
 movingPlaten.position.x+=(clampTarget-movingPlaten.position.x)*Math.min(1,dt*4.5);
 const screwTarget=['INJECTION','HOLDING'].includes(cyclePhase)?2.22:2.05;
 screw.position.x+=(screwTarget-screw.position.x)*Math.min(1,dt*3.5);
 if(cyclePhase==='EJECTION'){base.rotation.y+=dt*.55;shoulder.rotation.z=-.25+Math.sin(performance.now()*.003)*.045;elbow.rotation.z=Math.sin(performance.now()*.003)*.07}
 if(conveyorRunning)for(const roller of conveyorRollers)roller.rotation.z+=dt*5;
}
function interact(){if(activePanel){closePanel();return}const hit=nearestTarget();if(!hit){toast('No equipment in reach. Move closer and aim at an interactive part.');return}const n=hit.name;
if(n==='control console'||n==='ENGEL base'||n==='clamping unit'||n==='mold'||n==='injection unit'){
showPanel('ENGEL · Machine setup',`<p>Training HMI for the virtual ENGEL injection moulding machine. All values are illustrative controls, not a material-specific recipe.</p><div class="hmi-note">Training mode only · never transfer these example values to a real machine. Use the machine and resin supplier documentation for actual setup.</div><div class="grid">
 <div class="section-label">PLASTICISING UNIT</div>
 <div class="field"><label>Barrel zone 1 <output id="v1">220 °C</output></label><input type="range" min="160" max="300" value="220" data-unit=" °C" id="s1"></div>
 <div class="field"><label>Barrel zone 2 <output id="v2">230 °C</output></label><input type="range" min="160" max="300" value="230" data-unit=" °C" id="s2"></div>
 <div class="field"><label>Barrel zone 3 <output id="v7">225 °C</output></label><input type="range" min="160" max="300" value="225" data-unit=" °C" id="s7"></div>
 <div class="field"><label>Nozzle temperature <output id="v8">230 °C</output></label><input type="range" min="160" max="300" value="230" data-unit=" °C" id="s8"></div>
 <div class="field"><label>Screw speed <output id="v9">80 rpm</output></label><input type="range" min="10" max="250" value="80" data-unit=" rpm" id="s9"></div>
 <div class="field"><label>Back pressure <output id="v10">8 %</output></label><input type="range" min="0" max="100" value="8" data-unit=" %" id="s10"></div>
 <div class="section-label">INJECTION & HOLDING</div>
 <div class="field"><label>Injection speed <output id="v3">45 mm/s</output></label><input type="range" min="5" max="150" value="45" data-unit=" mm/s" id="s3"></div>
 <div class="field"><label>V/P transfer position <output id="v11">12 mm</output></label><input type="range" min="1" max="80" value="12" data-unit=" mm" id="s11"></div>
 <div class="field"><label>Holding pressure <output id="v4">55 %</output></label><input type="range" min="10" max="100" value="55" data-unit=" %" id="s4"></div>
 <div class="field"><label>Holding time <output id="v12">5 s</output></label><input type="range" min="1" max="20" value="5" data-unit=" s" id="s12"></div>
 <div class="section-label">CLAMPING & COOLING</div>
 <div class="field"><label>Cooling time <output id="v5">18 s</output></label><input type="range" min="5" max="60" value="18" data-unit=" s" id="s5"></div>
 <div class="field"><label>Clamping force <output id="v6">70 %</output></label><input type="range" min="20" max="100" value="70" data-unit=" %" id="s6"></div></div><button class="action" id="apply">APPLY TRAINING SETTINGS</button><button class="action" id="startCycle">START TRAINING CYCLE</button><p id="hmiResult">Machine is in setup mode. Apply settings, prepare material and close the safety gate before starting.</p><p id="cycleResult">Cycle status: STOPPED · interlocks not satisfied.</p>`);
 content.querySelectorAll('input[type=range]').forEach(input=>input.addEventListener('input',()=>{content.querySelector('#v'+input.id.slice(1)).textContent=input.value+input.dataset.unit;trainingSettingsApplied=false;document.querySelector('#cellStatus').textContent='SETUP REQUIRED';content.querySelector('#hmiResult').textContent='Parameter changed. Apply the training settings again before starting a cycle.'}));
 content.querySelector('#apply').onclick=()=>{if(machineCycleActive){toast('Cannot apply settings during a cycle');return}trainingSettingsApplied=true;document.querySelector('#cellStatus').textContent='PARAMETERS LOADED';content.querySelector('#hmiResult').textContent='Settings loaded. Prepare the selected resin and close the safety gate before starting a cycle.';toast('Training parameters applied')};content.querySelector('#startCycle').onclick=startTrainingCycle;
}else if(n.includes('ABB')||n.includes('gripper')||n==='robot pedestal'){
showPanel('ABB · Robot training',`<p>Six-axis robot teaching panel. Adjust each virtual joint to understand axis movement. This is not an ABB controller, a validated kinematic model or a RAPID compiler.</p><div class="hmi-note">Robot movement is illustrative. No real robot program or safety-rated motion is generated.</div><div class="grid">
 <div class="field"><label>Axis 1 · base <output id="a1">0°</output></label><input id="r1" type="range" min="-170" max="170" value="0"></div>
 <div class="field"><label>Axis 2 · shoulder <output id="a2">-15°</output></label><input id="r2" type="range" min="-100" max="100" value="-15"></div>
 <div class="field"><label>Axis 3 · elbow <output id="a3">35°</output></label><input id="r3" type="range" min="-120" max="120" value="35"></div>
 <div class="field"><label>Axis 4 · wrist 1 <output id="a4">0°</output></label><input id="r4" type="range" min="-200" max="200" value="0"></div>
 <div class="field"><label>Axis 5 · wrist 2 <output id="a5">0°</output></label><input id="r5" type="range" min="-125" max="125" value="0"></div>
 <div class="field"><label>Axis 6 · wrist 3 <output id="a6">0°</output></label><input id="r6" type="range" min="-350" max="350" value="0"></div></div><button class="action" id="home">MOVE TO SAFE HOME (SIMULATED)</button><p id="robotResult">Teaching mode · virtual axes ready for adjustment.</p>`);
 const applyRobotAxes=()=>{base.rotation.y=Number(content.querySelector('#r1').value)*Math.PI/180;shoulder.rotation.z=Number(content.querySelector('#r2').value)*Math.PI/180;elbow.rotation.z=Number(content.querySelector('#r3').value)*Math.PI/180;wrist.rotation.x=Number(content.querySelector('#r4').value)*Math.PI/180;wrist.rotation.y=Number(content.querySelector('#r5').value)*Math.PI/180;wrist.rotation.z=Number(content.querySelector('#r6').value)*Math.PI/180};
 content.querySelectorAll('input[type=range]').forEach(input=>input.addEventListener('input',()=>{content.querySelector('#a'+input.id.slice(1)).textContent=input.value+'°';applyRobotAxes()}));
 content.querySelector('#home').onclick=()=>{const values=[0,-15,35,0,0,0];values.forEach((v,i)=>{content.querySelector('#r'+(i+1)).value=v;content.querySelector('#a'+(i+1)).textContent=v+'°'});applyRobotAxes();content.querySelector('#robotResult').textContent='Virtual home pose selected. Validate real robot limits, tooling and safety zones independently.';toast('Virtual ABB home position selected')};
}else if(n==='material dryer'||n==='dryer hopper'||n==='temperature controller'){showPanel('Material preparation',`<p>Material drying is part of the process setup. Select the resin and verify the supplier's technical data sheet before choosing a real drying recipe.</p><div class="field"><label>Training material</label><select id="resin" style="width:100%;padding:10px;background:#263843;color:white;border:1px solid #536773;border-radius:7px"><option>ABS</option><option>PA6</option><option>PA66</option><option>PBT</option><option>PC/ABS</option><option>PP</option></select></div><button class="action" id="dry">START DRYER (SIMULATED)</button><p id="dryResult">Dryer idle.</p>`);content.querySelector('#dry').onclick=()=>{materialPrepared=true;content.querySelector('#dryResult').textContent='Training dryer started for '+content.querySelector('#resin').value+'. Material preparation acknowledged in the training model; actual conditions must come from the resin supplier specification.';toast('Virtual material preparation complete')};
}else if(n==='safety gate'){showPanel('Cell safety',`<p>Safety is a prerequisite for every setup and automatic cycle. This is a training-only interlock; it does not represent a certified safety circuit.</p><div class="field"><label>Training interlock state</label><strong id="gateState" style="color:var(--warn)">${safetyGateClosed?'GATE CLOSED · INTERLOCK SATISFIED':'GATE OPEN · AUTOMATIC MODE INHIBITED'}</strong></div><button class="action" id="gateToggle">${safetyGateClosed?'OPEN SAFETY GATE (SIMULATED)':'CLOSE SAFETY GATE (SIMULATED)'}</button><p id="gateResult">${machineCycleActive?'Cycle active. Gate opening is inhibited.':'The virtual gate state controls whether a training cycle may start.'}</p>`);content.querySelector('#gateToggle').onclick=()=>{if(machineCycleActive){content.querySelector('#gateResult').textContent='Opening blocked: the training cycle is active.';toast('Safety interlock: cycle active');return}safetyGateClosed=!safetyGateClosed;content.querySelector('#gateState').textContent=safetyGateClosed?'GATE CLOSED · INTERLOCK SATISFIED':'GATE OPEN · AUTOMATIC MODE INHIBITED';content.querySelector('#gateState').style.color=safetyGateClosed?'var(--accent)':'var(--warn)';content.querySelector('#gateToggle').textContent=safetyGateClosed?'OPEN SAFETY GATE (SIMULATED)':'CLOSE SAFETY GATE (SIMULATED)';content.querySelector('#gateResult').textContent=safetyGateClosed?'Gate closed in the training model.':'Gate open. Automatic cycle is inhibited.';toast(safetyGateClosed?'Virtual gate closed':'Virtual gate opened')}}
else if(n==='conveyor'){showPanel('Conveyor and part handling',`<p>Downstream handling equipment for moulded parts.</p><div class="field"><label>Training conveyor status</label><strong id="convState" style="color:var(--accent)">${conveyorRunning?'RUNNING':'STOPPED'}</strong></div><button class="action" id="conv">${conveyorRunning?'STOP CONVEYOR':'START CONVEYOR'}</button><p id="convResult">Virtual parts produced: ${partCount}.</p>`);content.querySelector('#conv').onclick=()=>{conveyorRunning=!conveyorRunning;content.querySelector('#convState').textContent=conveyorRunning?'RUNNING':'STOPPED';content.querySelector('#conv').textContent=conveyorRunning?'STOP CONVEYOR':'START CONVEYOR';content.querySelector('#convResult').textContent=conveyorRunning?'Conveyor rollers moving in the training model.':'Conveyor stopped.';toast(conveyorRunning?'Conveyor started':'Conveyor stopped')}}
else{showPanel('Equipment',`<p>${n} · This equipment will receive a dedicated training module in a later build.</p>`)}}
document.querySelector('#interact').addEventListener('click',interact);addEventListener('keydown',e=>{if(e.code==='KeyE'&&!activePanel)interact();if(e.code==='Escape')closePanel()});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!activePanel)move(dt);updateMachineMotion(dt);currentTarget=nearestTarget();const hint=document.querySelector('#hint');hint.innerHTML=currentTarget?'In reach: <strong>'+currentTarget.name+'</strong> · tap INTERACT':'Explore the cell. Walk up to equipment and aim at it.';renderer.render(scene,camera)}
const clock=new THREE.Clock();updateCamera();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight)});
